services:
  laju-go:
    build: .
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    env_file: .env
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${APP_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
